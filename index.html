<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SevaSetu – Trust for every home, Work for every hand</title>
  <link rel="icon" href="assets/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1F7A70">
  <link
    href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;800&family=Outfit:wght@700;800&family=Pacifico&display=swap"
    rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" crossorigin="">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" crossorigin=""></script>
  <style>
    :root {
      --bg: #f6faf9;
      --card: #fff;
      --ink: #15302c;
      --mut: #4f6761;
      --line: #d6e4e0;
      --acc: #F2A66B;
      --soft: #fdeedd;
      --ok: #12805f;
      --bad: #b3261e;
      --pri: #1F7A70;
      --onpri: #fff;
      --sh: 0 1px 2px rgba(16, 35, 32, .07);
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    [hidden] {
      display: none !important
    }

    * {
      box-sizing: border-box
    }

    html {
      scroll-padding-top: env(safe-area-inset-top, 0px);
      -webkit-text-size-adjust: 100%
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 400 18px/1.55 Mukta, system-ui, -apple-system, "Segoe UI", sans-serif
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0 0 auto;
      height: env(safe-area-inset-top, 0px);
      background: var(--card);
      z-index: 10
    }

    h1,
    h2,
    h3 {
      line-height: 1.15;
      margin: 0 0 .5rem;
      font-weight: 800
    }

    h1 {
      font-size: clamp(2.1rem, 7vw, 3.6rem);
      letter-spacing: -.01em
    }

    h2 {
      font-size: 1.75rem
    }

    h3 {
      font-size: 1.2rem
    }

    a {
      color: var(--pri);
      font-weight: 600
    }

    header {
      background: var(--card);
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: env(safe-area-inset-top, 0px);
      z-index: 9
    }

    .bar {
      max-width: 1060px;
      margin: auto;
      padding: .55rem 1rem;
      display: flex;
      gap: .5rem;
      align-items: center;
      flex-wrap: wrap
    }

    .logo {
      font-weight: 800;
      font-size: 1.5rem;
      text-decoration: none;
      color: var(--ink);
      margin-right: .6rem
    }

    .logo span {
      color: var(--pri)
    }

    nav {
      display: flex;
      gap: .25rem;
      flex-wrap: wrap
    }

    nav a {
      padding: .45rem .8rem;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;
      color: var(--mut);
      display: flex;
      align-items: center;
      gap: .4rem
    }

    nav a.on {
      background: var(--soft);
      color: var(--ink)
    }

    #nav {
      margin-left: auto
    }

    #nav a {
      font-size: .92rem;
      padding: .35rem .6rem
    }

    #tabs i {
      display: none;
      font-style: normal
    }

    main {
      max-width: 1060px;
      margin: auto;
      padding: 1.2rem 1rem 3rem
    }

    .demo {
      background: var(--soft);
      border-bottom: 1px solid var(--acc);
      text-align: center;
      font-size: .9rem;
      padding: .4rem 1rem
    }

    .grid {
      display: grid;
      gap: 1rem;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr))
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 1.1rem;
      box-shadow: var(--sh)
    }

    a.card {
      color: var(--ink);
      transition: border-color .15s
    }

    a.card:hover {
      border-color: var(--pri)
    }

    a.card:active {
      background: var(--soft)
    }

    .row {
      display: flex;
      gap: .6rem;
      flex-wrap: wrap;
      align-items: center
    }

    .sp {
      justify-content: space-between
    }

    .btn {
      font: inherit;
      font-weight: 700;
      border: 2px solid var(--pri);
      background: var(--pri);
      color: var(--onpri);
      border-radius: 12px;
      padding: .6rem 1.1rem;
      min-height: 48px;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center
    }

    .btn:active {
      transform: scale(.98)
    }

    .btn.alt {
      background: transparent;
      color: var(--ink);
      border-color: var(--line)
    }

    .btn.bad {
      background: transparent;
      color: var(--bad);
      border-color: var(--bad)
    }

    .btn.sm {
      padding: .3rem .8rem;
      font-size: .95rem;
      min-height: 42px
    }

    :focus-visible {
      outline: 3px solid var(--acc);
      outline-offset: 2px
    }

    label {
      display: block;
      font-weight: 600;
      font-size: .98rem;
      margin: .8rem 0 .25rem
    }

    input,
    select,
    textarea {
      font: inherit;
      font-size: 1rem;
      width: 100%;
      min-height: 48px;
      padding: .6rem .75rem;
      border: 1.5px solid var(--line);
      border-radius: 12px;
      background: var(--bg);
      color: var(--ink)
    }

    textarea {
      min-height: 5rem
    }

    input[type=checkbox] {
      min-height: 0;
      width: 1.3rem;
      height: 1.3rem;
      accent-color: var(--pri);
      vertical-align: middle;
      margin-right: .5rem
    }

    .tag {
      display: inline-flex;
      align-items: center;
      font-size: .85rem;
      font-weight: 600;
      padding: .1rem .6rem;
      border-radius: 99px;
      border: 1px solid var(--line);
      color: var(--mut)
    }

    .tag.ok {
      color: var(--ok);
      border-color: var(--ok)
    }

    .tag.warn {
      color: var(--bad);
      border-color: var(--bad)
    }

    .tag.demo {
      background: var(--soft);
      color: var(--ink);
      border-color: var(--acc)
    }

    .dot {
      width: .6rem;
      height: .6rem;
      border-radius: 50%;
      background: var(--mut);
      display: inline-block;
      margin-right: .4rem
    }

    .tag.ok .dot {
      background: var(--ok)
    }

    .mut {
      color: var(--mut);
      font-size: .95rem
    }

    .err {
      color: var(--bad);
      font-size: .95rem;
      min-height: 1.2em
    }

    .hero {
      display: grid;
      gap: 1.5rem;
      grid-template-columns: 1.2fr 1fr;
      align-items: center;
      padding: 1rem 0 1.5rem
    }

    .hero>.card {
      border-top: 6px solid var(--acc)
    }

    @media(max-width:760px) {
      .hero {
        grid-template-columns: 1fr
      }
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-variant-numeric: tabular-nums
    }

    td,
    th {
      padding: .5rem 0;
      text-align: left;
      border-bottom: 1px dashed var(--line)
    }

    td:last-child,
    th:last-child {
      text-align: right
    }

    .tot td {
      font-weight: 800;
      font-size: 1.15rem;
      border-bottom: 0;
      border-top: 2px solid var(--ink)
    }

    .stat {
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--pri)
    }

    .steps {
      display: flex;
      gap: .3rem;
      flex-wrap: wrap;
      margin: .6rem 0
    }

    .steps span {
      font-size: .82rem;
      padding: .2rem .6rem;
      border-radius: 8px;
      background: var(--bg);
      color: var(--mut)
    }

    .steps .d {
      background: var(--ok);
      color: #fff
    }

    .steps .c {
      background: var(--acc);
      color: #14213d;
      font-weight: 700
    }

    .wc {
      display: grid;
      grid-template-columns: 56px 1fr;
      gap: .2rem .85rem;
      align-content: start
    }

    .wc .wm {
      min-width: 0
    }

    .wc .full {
      grid-column: 1/-1
    }

    .wc h3 {
      margin: 0
    }

    .wc p {
      margin: .3rem 0
    }

    .av {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 1.2rem;
      background: hsl(var(--h) 55% 88%);
      color: hsl(var(--h) 60% 22%)
    }

    .price {
      margin: .3rem 0
    }

    .price b {
      font-size: 1.5rem;
      font-weight: 800
    }

    details summary {
      cursor: pointer;
      min-height: 44px;
      display: flex;
      align-items: center
    }

    #toast {
      position: fixed;
      left: 50%;
      bottom: calc(1rem + env(safe-area-inset-bottom, 0px));
      transform: translateX(-50%);
      background: var(--pri);
      color: var(--onpri);
      font-weight: 600;
      padding: .7rem 1.1rem;
      border-radius: 12px;
      display: none;
      z-index: 20;
      max-width: 90%
    }

    @media(max-width:760px) {
      #tabs {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 12;
        background: var(--card);
        border-top: 1px solid var(--line);
        padding: .35rem .5rem calc(.35rem + env(safe-area-inset-bottom, 0px));
        gap: .25rem;
        flex-wrap: nowrap
      }

      #tabs a {
        flex: 1;
        flex-direction: column;
        gap: 0;
        padding: .35rem .2rem;
        font-size: .75rem;
        text-align: center;
        justify-content: center;
        min-height: 56px
      }

      #tabs i {
        display: block;
        font-size: 1.35rem;
        line-height: 1.2
      }

      body.hastabs main {
        padding-bottom: 6.5rem
      }

      body.hastabs #toast {
        bottom: calc(5.5rem + env(safe-area-inset-bottom, 0px))
      }

      #nav {
        margin-left: auto
      }
    }

    form.card>.grid {
      grid-template-columns: 1fr 1fr;
      gap: 0 .7rem
    }

    form.card>.grid>div:first-child {
      grid-column: 1/-1
    }

    .svc {
      grid-template-columns: repeat(4, 1fr)
    }

    @media(max-width:760px) {
      .svc {
        grid-template-columns: 1fr 1fr
      }
    }

    @media(min-width:761px) {
      form.card>.grid {
        grid-template-columns: 2fr 1fr 1fr 1fr
      }

      form.card>.grid>div:first-child {
        grid-column: auto
      }
    }

    .logo {
      display: flex;
      align-items: center;
      gap: .55rem;
      color: var(--ink);
      text-decoration: none;
      font-weight: 400
    }

    .logo .mk {
      width: 38px;
      height: 38px;
      flex: none
    }

    .wm {
      display: flex;
      align-items: baseline;
      line-height: 1.1
    }

    .sv {
      font-family: Outfit, Mukta, system-ui, sans-serif;
      font-weight: 800;
      letter-spacing: -.02em;
      color: var(--ink)
    }

    .st {
      font-family: Pacifico, cursive;
      font-weight: 400;
      color: #25B8A8;
      margin-left: 2px
    }

    .logo .sv {
      font-size: 1.45rem
    }

    .logo .st {
      font-size: 1.3rem
    }

    .lkb {
      display: flex;
      align-items: center;
      gap: .8rem
    }

    .lkb .mk {
      width: 64px;
      height: 64px;
      flex: none
    }

    .lkb .sv {
      font-size: 2.6rem
    }

    .lkb .st {
      font-size: 2.3rem
    }

    .mt {
      font-family: Outfit, Mukta, system-ui, sans-serif;
      font-weight: 700;
      font-size: 1.05rem;
      margin-top: .7rem;
      color: var(--ink)
    }

    @media(max-width:760px) {
      .logo .st {
        font-size: 1.2rem
      }

      .lkb .mk {
        width: 52px;
        height: 52px
      }

      .lkb .sv {
        font-size: 2.1rem
      }

      .lkb .st {
        font-size: 1.9rem
      }
    }

    @media(prefers-reduced-motion:reduce) {
      * {
        transition: none !important
      }
    }

    /* Map styles */
    #map-container {
      position: relative;
      width: 100%;
      height: 400px;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--line);
      background: var(--card);
      box-shadow: var(--sh);
      z-index: 1
    }

    @media(max-width:600px) {
      #map-container {
        height: 330px
      }
    }

    .map-badge-bar {
      display: flex;
      gap: .5rem;
      align-items: center;
      flex-wrap: wrap;
      margin: .6rem 0
    }

    .map-pin {
      background: var(--pri);
      color: #fff;
      border-radius: 50%;
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      box-shadow: 0 3px 8px rgba(0, 0, 0, .25);
      border: 2.5px solid #fff;
      cursor: pointer
    }

    .map-pin.busy {
      background: #718096
    }

    .leaflet-popup-content-wrapper {
      border-radius: 14px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, .18);
      font-family: inherit
    }

    .leaflet-popup-content {
      margin: 10px 12px;
      line-height: 1.4
    }

    /* Task chips */
    .chips {
      display: flex;
      gap: .3rem;
      flex-wrap: wrap;
      margin: .3rem 0
    }

    .chip {
      display: inline-flex;
      align-items: center;
      font-size: .78rem;
      font-weight: 600;
      padding: .15rem .55rem;
      border-radius: 99px;
      background: var(--bg);
      border: 1px solid var(--line);
      color: var(--mut)
    }

    .chip.ok {
      background: #e8f5f0;
      border-color: var(--ok);
      color: var(--ok)
    }

    /* House-help section banner */
    .hh-banner {
      background: linear-gradient(135deg, #1F7A70 0%, #25B8A8 100%);
      color: #fff;
      border-radius: 16px;
      padding: 1.2rem;
      margin-bottom: 1rem
    }

    .hh-banner h2 {
      color: #fff;
      margin-bottom: .3rem
    }

    .hh-banner .mut {
      color: rgba(255, 255, 255, .8)
    }

    /* Safety note */
    .safety-note {
      background: #fff8f0;
      border: 1.5px solid var(--acc);
      border-radius: 12px;
      padding: .7rem 1rem;
      font-size: .9rem;
      margin: .5rem 0
    }

    /* Task checklist group */
    .task-group {
      margin: .7rem 0
    }

    .task-group h4 {
      font-size: .95rem;
      font-weight: 700;
      color: var(--mut);
      margin: 0 0 .3rem;
      text-transform: uppercase;
      letter-spacing: .04em
    }

    .task-check-row {
      display: flex;
      align-items: center;
      gap: .4rem;
      padding: .2rem 0
    }

    .task-check-row input[type=checkbox] {
      flex: none
    }

    .task-check-row label {
      margin: 0;
      font-weight: 400;
      font-size: .95rem
    }
  </style>
</head>

    function steps(b) {
      if (['rejected', 'cancelled'].includes(b.status)) return `<div class="steps"><span class="c">${LBL[b.status]}</span></div>`;
      let roundTxt = '';
      if (b.status === 'negotiating') roundTxt = ` (Counter ${b.quote?.round || 2}/3)`;
      else if (b.status === 'quoted' && (b.quote?.round || 1) > 1) roundTxt = ` (Rev ${b.quote.round}/3)`;
      else if (b.status === 'approved' && b.agreedPrice) roundTxt = ` (${R(b.agreedPrice.total)})`;
      const i = FLOW.indexOf(b.status === 'negotiating' ? 'quoted' : b.status);
      return `<div class="steps">${FLOW.map((s, k) => `<span class="${k < i ? 'd' : k === i ? 'c' : ''}">${LBL[s]}${k === i ? roundTxt : ''}</span>`).join('')}</div>` +
        (b.status === 'negotiating' ? `<div class="mut">Counter-offer in negotiation (Round ${b.quote?.round || 2}/3).</div>` : '');

${b.report ? `<p class="tag warn">Issue reported: ${esc(b.report.s)}</p>` : `${['approved', 'completed', 'accepted', 'quoted'].includes(b.status) ? `<details style="margin-top:.5rem"><summary>Report an issue</summary><textarea id="ri${b.id}" rows="2" placeholder="What went wrong?"></textarea><button class="btn alt sm" onclick="report('${b.id}')">Send report</button><div class="err" id="rie${b.id}"></div></details>` : ''}`}

    function acceptCounter(id) { const b = B(id); b.agreedPrice = { total: b.quote.total || total(b.quote), labor: b.quote.labor, mat: b.quote.mat, travel: b.quote.travel, agreedAt: new Date().toISOString() }; setS(id, 'approved', 'Counter-offer accepted! Price locked at ' + R(b.agreedPrice.total)); }

<h3>Job requests and history</h3>${list.length ? list.map(b => `<div class="card" style="margin-bottom:.8rem"><div class="row sp"><b>${esc(b.cat)} · ${esc(b.loc)}</b><span class="tag">${LBL[b.status]}</span></div><div class="mut">${fmtW(b)}</div><p>${esc(b.desc)}</p>

${['accepted', 'negotiating'].includes(b.status) && (!b.quote || (b.quote.round || 1) < 3) ? `<h3>${b.status === 'accepted' ? 'Send itemised quote' : 'Send counter-offer back (Final Round 3/3)'}</h3><div class="grid" style="grid-template-columns:repeat(3,1fr)"><div><label for="ql${b.id}">Labour ₹</label><input id="ql${b.id}" type="number" min="50" value="${b.quote ? b.quote.labor : w.rate}"></div><div><label for="qm${b.id}">Materials ₹</label><input id="qm${b.id}" type="number" min="0" value="${b.quote ? b.quote.mat : 0}"></div><div><label for="qt${b.id}">Travel ₹</label><input id="qt${b.id}" type="number" min="0" value="${b.quote ? b.quote.travel : w.travel}"></div></div><label for="qn${b.id}">Note (materials / work scope)</label><input id="qn${b.id}" value="${b.quote ? esc(b.quote.note) : ''}"><div class="err" id="qe${b.id}"></div><button class="btn" onclick="quote('${b.id}')">${b.status === 'accepted' ? 'Send quote' : 'Send revised quote'}</button>` : ''}
${b.status === 'approved' ? `<button class="btn" onclick="setS('${b.id}','completed','Marked completed (demo)')">Mark job completed</button>` : ''}

      const n = $('#rn').value.trim(), s = $('#rs').value.trim(), e = $('#re2').value, r = +$('#rr2').value;
      const u = $('#ru2') ? $('#ru2').value : 'per_hour', cat = $('#rc2').value;
      if (n.length < 2 || s.length < 3 || e === '' || !(r >= 50)) { $('#rg').textContent = 'Fill every field. Rate must be at least ₹50.'; return }

      let tasks = [];
      if (cat === 'House help') {
        tasks = Array.from(document.querySelectorAll('.reg-task:checked')).map(el => el.value);
        const otherVal = ($('#reg-task-other')?.value || '').trim().replace(/[<>&"']/g, '').slice(0, 120);
        if (otherVal) tasks.push(otherVal);
        if (tasks.length === 0) { document.getElementById('rgtask').textContent = 'Tick at least one task you can do.'; return; }
        if (document.getElementById('rgtask')) document.getElementById('rgtask').textContent = '';
      }
      const id = 'w' + (S.workers.length + 1 + Date.now() % 1000);
      S.workers.push({ id, name: n, cat, loc: $('#rl').value, exp: +e, rate: r, unit: u, travel: 30, avail: true, skills: s, rating: 0, rc: 0, ver: 'Unverified', demo: false, hidden: false, tasks, geo: { lat: 12.9716, lng: 77.5946, dist: '1.0 km', eta: '~20 min' } });
      S.me = id; save(); toast('Profile created as Unverified'); render();
    }

    /* IMPACT */
    function impact() {
      const c = s => S.bookings.filter(b => s.includes(b.status)).length;
      const rv = S.bookings.filter(b => b.review);
      return `<h2>Prototype impact dashboard</h2><p class="mut">Counts come only from actions taken in this browser demo. They are not real-world impact.</p><div class="grid">
${[['Requests created', S.bookings.length], ['Requests accepted', S.bookings.filter(b => b.quote || ['accepted', 'approved', 'completed'].includes(b.status)).length], ['Quotes approved', S.bookings.filter(b => ['approved', 'completed'].includes(b.status)).length], ['Completed demo bookings', c(['completed'])], ['Reviews submitted', rv.length], ['Issues reported', S.bookings.filter(b => b.report).length]].map(x => `<div class="card"><div class="stat">${x[1]}</div>${x[0]}</div>`).join('')}</div>
<button class="btn alt" style="margin-top:1rem" onclick="if(confirm('Reset all demo data?')){localStorage.removeItem('kaamsetu');S=seed();render()}">Reset demo data</button>`;
    }

    /* ADMIN */
    function admin() {
      const rs = S.bookings.filter(b => b.report);
      return `<h2>Admin and safety <span class="tag demo">Demo – no login</span></h2><p class="mut">In production this page needs admin sign-in. Here it is open so judges can see the workflow.</p>
<h3>Complaints</h3>${rs.length ? rs.map(b => `<div class="card" style="margin-bottom:.6rem"><b>${esc(b.cat)} with ${esc(W(b.wid).name)}</b> <span class="tag ${b.report.s === 'Open' ? 'warn' : 'ok'}">${b.report.s}</span><p>${esc(b.report.t)}</p>${b.report.note ? `<p class="mut">Resolution: ${esc(b.report.note)}</p>` : `<div class="row"><input id="rn${b.id}" placeholder="Resolution note" style="flex:1"><button class="btn sm" onclick="resolve('${b.id}')">Resolve</button></div>`}</div>`).join('') : '<div class="card">No complaints. Reports from customers appear here.</div>'}
<h3>Listings</h3><div class="grid">${S.workers.map(w => `<div class="card row sp"><span>${esc(w.name)}<br><span class="mut">${w.hidden ? 'Hidden from search' : 'Listed'}</span></span><button class="btn alt sm" onclick="W('${w.id}').hidden=!W('${w.id}').hidden;save();render()">${w.hidden ? 'Show' : 'Hide'}</button></div>`).join('')}</div>`;
    }
    function resolve(id) { const n = $('#rn' + id).value.trim(); if (n.length < 5) { toast('Add a resolution note'); return } B(id).report.s = 'Resolved'; B(id).report.note = n; save(); toast('Complaint resolved'); render(); }

    /* ABOUT */
    function about() {
      return `<h2>About this prototype</h2><div class="card"><p><b>Works:</b> search and filters, worker profiles, booking requests, accept or decline, itemised quotes, quote revision, approval, status tracking, completion, reviews, issue reports, admin resolution, worker registration (including House help task checklist), impact counts, map with tile fallback.</p><p><b>Not real:</b> sample workers, ratings and earnings. There is no backend, login, payment, identity or background check. Data lives in this browser's storage only.</p><p><b>Next steps:</b> Supabase or Firebase for shared data and sign-in, phone OTP, real document verification with consent, local-language support.</p></div>`;
    }

    /* ============================================================
       MAP VIEW – Task A: OSM → CARTO fallback
       ============================================================ */
    function mapView() {
      const list = S.workers.filter(w => !w.hidden);
      return `<div class="row sp" style="margin-bottom:.5rem">
    <h2>Nearby workers map</h2>
    <a class="btn alt sm" href="#find">List view</a>
  </div>
  <div class="map-badge-bar">
    <span class="tag ok"><span class="dot"></span>Available within ~30 min</span>
    <span class="tag demo">Central Bengaluru Demo Locality</span>
  </div>
  <div id="map-wrap">
    <div id="map-container" role="region" aria-label="Nearby workers map">
      <div id="leaflet-map" style="width:100%;height:100%"></div>
    </div>
    <div id="map-fallback" style="display:none;margin-top:1rem">
      <div class="card" style="background:var(--soft);border:1.5px solid var(--acc);margin-bottom:1rem">
        <b>Map tiles unavailable (offline or access blocked).</b><br>Showing all nearby workers with distance and arrival estimates below.
      </div>
      <div class="grid">${list.map(wcard).join('')}</div>
    </div>
  </div>
  <div id="selected-worker-card" style="margin-top:1rem"></div>`;
    }
    let _leafletMap = null;
    function initMap() {
      const mapEl = $('#leaflet-map'), fallbackEl = $('#map-fallback'), containerEl = $('#map-container');
      if (!mapEl) return;
      if (typeof L === 'undefined') {
        if (containerEl) containerEl.style.display = 'none';
        if (fallbackEl) fallbackEl.style.display = 'block';
        return;
      }
      try {
        if (_leafletMap) { try { _leafletMap.remove(); } catch (e) { } _leafletMap = null; }
        const center = [12.9716, 77.5946];
        _leafletMap = L.map('leaflet-map', { zoomControl: true, scrollWheelZoom: false }).setView(center, 14);

        // Task A: OSM tile layer with tileerror → switch to CARTO, then fallback to list
        let usingCarto = false;
        const osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
          maxZoom: 18, errorTileUrl: ''
        });
        osmLayer.on('tileerror', function () {
          if (usingCarto) return; // already switched
          usingCarto = true;
          osmLayer.remove();
          const cartoLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
            subdomains: 'abcd', maxZoom: 19, errorTileUrl: ''
          });
          cartoLayer.on('tileerror', function () {
            // Both failed – show list fallback
            if (containerEl) containerEl.style.display = 'none';
            if (fallbackEl) fallbackEl.style.display = 'block';
          });
          cartoLayer.addTo(_leafletMap);
        });
        osmLayer.addTo(_leafletMap);

        const userIcon = L.divIcon({
          className: 'custom-user-pin',
          html: '<div style="background:#b3261e;color:#fff;border-radius:50%;width:34px;height:34px;display:grid;place-items:center;font-size:1.1rem;border:2.5px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.3)">📍</div>',
          iconSize: [34, 34], iconAnchor: [17, 17]
        });
        L.marker(center, { icon: userIcon }).addTo(_leafletMap).bindPopup('<b>You are here (Sample Location)</b><br><span class="mut">Central Bengaluru</span>');

        const bounds = L.latLngBounds([center]);
        const active = S.workers.filter(w => !w.hidden && w.geo);
        active.forEach(w => {
          const pinHtml = `<div class="map-pin ${w.avail ? '' : 'busy'}" title="${esc(w.name)}">${CATS[w.cat] || '🛠️'}</div>`;
          const icon = L.divIcon({ className: 'custom-worker-pin', html: pinHtml, iconSize: [38, 38], iconAnchor: [19, 19], popupAnchor: [0, -18] });
          const marker = L.marker([w.geo.lat, w.geo.lng], { icon }).addTo(_leafletMap);
          bounds.extend([w.geo.lat, w.geo.lng]);
          const popHtml = `<div style="min-width:180px">
        <div style="font-weight:800;font-size:1.05rem">${esc(w.name)}</div>
        <div style="font-size:.9rem;color:#4f6761">${CATS[w.cat] || '🛠️'} ${esc(w.cat)} · ${esc(w.loc)}</div>
        <div style="margin:.3rem 0;display:flex;gap:.3rem;flex-wrap:wrap">
          <span class="tag ok" style="font-size:.75rem">📍 ${esc(w.geo.dist || '1 km')}</span>
          <span class="tag ok" style="font-size:.75rem">⚡ ${esc(w.geo.eta || '~25 min')}</span>
        </div>
        <div style="font-weight:800;color:#1F7A70;margin:.3rem 0">${R(w.rate)} <span style="font-size:.8rem;color:#4f6761">${fmtUnit(w.unit || 'per_hour')}</span></div>
        <div style="margin-top:.4rem;display:flex;gap:.4rem">
          <button class="btn sm" style="min-height:34px;padding:.2rem .6rem;font-size:.85rem;width:100%" onclick="selectMapWorker('${w.id}')">Select</button>
          <a class="btn alt sm" style="min-height:34px;padding:.2rem .6rem;font-size:.85rem;width:100%" href="#worker/${w.id}">Profile</a>
        </div>
      </div>`;
          marker.bindPopup(popHtml);
          marker.on('click', () => selectMapWorker(w.id));
        });
        if (active.length > 0) _leafletMap.fitBounds(bounds, { padding: [30, 30], maxZoom: 15 });
        setTimeout(() => { if (_leafletMap) _leafletMap.invalidateSize(); }, 150);
      } catch (err) {
        if (containerEl) containerEl.style.display = 'none';
        if (fallbackEl) fallbackEl.style.display = 'block';
      }
    }
    function selectMapWorker(id) {
      const cardEl = $('#selected-worker-card'), w = W(id);
      if (!cardEl || !w) return;
      cardEl.innerHTML = `<h3 style="margin-bottom:.5rem">Selected worker</h3>` + wcard(w);
      cardEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    /* ============================================================
       ROLE CHOICE & PROVIDER SIGN-UP
       ============================================================ */
    let J = { step: 1, d: null, otp: '', tries: 0 };
    function welcome() {
      return `<section class="hero" style="grid-template-columns:1fr"><div><div class="lkb"><svg class="mk" viewBox="0 0 76 76" aria-hidden="true"><rect width="76" height="76" rx="20" fill="#1F7A70"/><path d="M14 50 Q38 8 62 50" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/><rect x="12" y="50" width="52" height="7" rx="3.5" fill="#F2A66B"/></svg><div class="wm"><span class="sv">Seva</span><span class="st">Setu</span></div></div><div class="mt">Trust for every home, Work for every hand.</div><h1 style="margin-top:1.2rem">Welcome to SevaSetu</h1><p>Choose how you want to use the app. You can switch any time.</p></div></section>
<div class="grid"><div class="card"><h2>🏠 I need a service</h2><p>Find nearby workers and see a clear price before work starts.</p><form onsubmit="event.preventDefault();startCust()"><label for="cn">Your name</label><input id="cn"><label for="cl">Your locality</label><select id="cl">${LOCS.map(l => `<option>${l}</option>`).join('')}</select><div class="err" id="ce" role="alert"></div><button class="btn">Continue as customer</button></form></div>
<div class="card"><h2>🛠️ I provide a service</h2><p>List your skills, set your own rate and receive job requests. A sample verification step comes first.</p><a class="btn" href="#join">Continue as service provider</a></div></div>`;
    }
    function startCust() { const n = $('#cn').value.trim(); if (n.length < 2) { $('#ce').textContent = 'Enter your name.'; return } S.role = 'customer'; S.user = { name: n, loc: $('#cl').value }; save(); location.hash = 'find'; }
    function logout() { S.role = null; S.user = null; save(); render(); }
    function acceptJob(id) { if (W(S.me).ver === 'Unverified') { toast('Complete sample verification to accept jobs'); location.hash = 'join'; return } setS(id, 'accepted', 'Request accepted. Send a quote next.'); }
    function clearJoinErr(fieldId) {
      const el = document.getElementById(fieldId + 'err');
      if (el) el.textContent = '';
      const formErr = document.getElementById('jerr');
      if (formErr) formErr.textContent = '';
    }
    function clearAllJoinErrs() {
      ['jn', 'jm', 'js', 'jx', 'jr', 'jtask', 'ja', 'jd', 'jk'].forEach(k => {
        const el = document.getElementById(k + 'err');
        if (el) el.textContent = '';
      });
      const formErr = document.getElementById('jerr');
      if (formErr) formErr.textContent = '';
    }
    function showJoinFieldErr(fieldId, msg) {
      clearAllJoinErrs();
      const errEl = document.getElementById(fieldId + 'err');
      if (errEl) errEl.textContent = msg;
      const formErr = document.getElementById('jerr');
      if (formErr) formErr.textContent = msg;
      const inputEl = document.getElementById(fieldId);
      const target = inputEl || errEl;
      if (target) {
        if (typeof target.scrollIntoView === 'function') {
          target.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
        if (typeof target.focus === 'function') {
          target.focus();
        }
      }
    }
    function toggleJoinTaskSection(cat) {
      const el = document.getElementById('join-task-section');
      if (el) el.style.display = cat === 'House help' ? 'block' : 'none';
    }
    function join() {
      if (J.step === 2) return `<h2>Verify (sample)</h2><div class="card"><p class="tag demo">Demo code: <b>${J.otp}</b></p><p class="mut">In a real app this code goes to the mobile linked to Aadhaar. Here it is shown on screen because the verification is simulated.</p><label for="jo">Enter the 6-digit code</label><input id="jo" inputmode="numeric" maxlength="6" oninput="if($('#je'))$('#je').textContent=''"><div class="err" id="je" role="alert"></div><button class="btn" onclick="joinOtp()">Verify</button> <button class="btn alt" onclick="J.step=1;J.tries=0;render()">Back</button></div>`;
      return `<a href="#welcome">← Back</a><h2>Become a service provider</h2><form class="card" onsubmit="event.preventDefault();joinGo()" oninput="clearAllJoinErrs()">
<label for="jn">Full name</label><input id="jn" oninput="clearJoinErr('jn')"><div class="err" id="jnerr" role="alert"></div>

<label for="jm">Mobile number (10 digits)</label><input id="jm" inputmode="numeric" maxlength="10" oninput="clearJoinErr('jm')"><div class="err" id="jmerr" role="alert"></div>

<label for="jc">Service</label><select id="jc" onchange="toggleJoinTaskSection(this.value);clearJoinErr('jtask')">${PRIMARY_CATS.map(c => `<option>${c}</option>`).join('')}</select>

<label for="jl">Locality you serve</label><select id="jl">${LOCS.map(c => `<option>${c}</option>`).join('')}</select>

<label for="js">Skills</label><input id="js" oninput="clearJoinErr('js')"><div class="err" id="jserr" role="alert"></div>

<label for="jx">Years of experience</label><input id="jx" type="number" min="0" max="60" oninput="clearJoinErr('jx')"><div class="err" id="jxerr" role="alert"></div>

<label for="jr">Base rate (₹)</label><input id="jr" type="number" min="50" oninput="clearJoinErr('jr')"><div class="err" id="jrerr" role="alert"></div>

<label for="jru">Rate unit</label><select id="jru"><option value="per_hour">Per hour (/hr)</option><option value="per_visit">Per visit (/visit)</option><option value="per_day">Per day (/day)</option></select>

<!-- Task C: House help task checklist in join flow (visible by default because House help is default category) -->
<div id="join-task-section" style="display:block">
  <label>What work can you do? (tick at least one)</label>
  <div class="card" style="padding:.6rem;background:var(--bg)">
  ${Object.keys(HH_TASK_GROUPS).map(grp => `
  <div class="task-group"><h4>${grp}${grp === 'Senior care' ? ` <small style="font-weight:400;text-transform:none">${t('senior_note')}</small>` : ''}</h4>
  ${HH_TASK_GROUPS[grp].map(tk => `<div class="task-check-row"><input type="checkbox" class="join-task" id="jtk_${esc(tk.replace(/\W/g, '_'))}" value="${esc(tk)}" onchange="clearJoinErr('jtask')"><label for="jtk_${esc(tk.replace(/\W/g, '_'))}">${esc(tk)}</label></div>`).join('')}
  </div>`).join('')}
  <div class="task-group"><h4>Other</h4><input id="join-task-other" maxlength="120" placeholder="Describe any additional services" oninput="clearJoinErr('jtask')"></div>
  </div>
  <div class="err" id="jtaskerr" role="alert"></div>
</div>

<label for="ja">Home address (private)</label><textarea id="ja" rows="2" oninput="clearJoinErr('ja')"></textarea><div class="err" id="jaerr" role="alert"></div><p class="mut">Used only for admin checks. Never shown to customers.</p>

<label for="jd">Aadhaar number (12 digits)</label><input id="jd" inputmode="numeric" maxlength="12" oninput="clearJoinErr('jd')"><div class="err" id="jderr" role="alert"></div><p class="mut"><b>Demo only: do not enter a real Aadhaar number.</b> Type any 12 digits. Only the last 4 digits are kept.</p>

<label><input id="jk" type="checkbox" style="width:auto" onchange="clearJoinErr('jk')"> I agree to this sample verification</label><div class="err" id="jkerr" role="alert"></div>
<div class="err" id="jerr" role="alert"></div>
<button class="btn" id="join-submit-btn">Send demo code</button></form>`;
    }
    function joinGo() {
      clearAllJoinErrs();
      const g = i => ($('#' + i)?.value || '').trim();
      const d = g('jd');

      if (g('jn').length < 2) { showJoinFieldErr('jn', 'Enter your full name.'); return; }
      if (!/^\d{10}$/.test(g('jm'))) { showJoinFieldErr('jm', 'Mobile number must be 10 digits.'); return; }
      if (g('js').length < 3) { showJoinFieldErr('js', 'Add your skills.'); return; }
      if (g('jx') === '' || isNaN(+g('jx')) || +g('jx') < 0) { showJoinFieldErr('jx', 'Enter years of experience.'); return; }
      const rVal = +g('jr');
      if (!g('jr') || isNaN(rVal) || rVal < 50) { showJoinFieldErr('jr', 'Rate must be at least ₹50.'); return; }

      // House help task validation
      const cat = g('jc') || 'House help';
      let tasks = [];
      if (cat === 'House help') {
        tasks = Array.from(document.querySelectorAll('.join-task:checked')).map(el => el.value);
        const otherVal = ($('#join-task-other')?.value || '').trim().replace(/[<>&"']/g, '').slice(0, 120);
        if (otherVal) tasks.push(otherVal);
        if (tasks.length === 0) {
          toggleJoinTaskSection('House help');
          showJoinFieldErr('jtask', 'Tick at least one task you can do.');
          return;
        }
      }

      // Address validation
      if (!g('ja')) { showJoinFieldErr('ja', 'Enter your home address.'); return; }
      if (g('ja').length < 8) { showJoinFieldErr('ja', 'Address is too short. Add house number, street and area.'); return; }

      // Aadhaar validation
      if (!/^\d{12}$/.test(d)) { showJoinFieldErr('jd', 'Aadhaar number must be 12 digits.'); return; }

      // Consent validation
      if (!$('#jk')?.checked) { showJoinFieldErr('jk', 'Tick the consent box to continue.'); return; }

      J = {
        step: 2,
        otp: String(100000 + Math.floor(Math.random() * 900000)),
        tries: 0,
        d: {
          n: g('jn'),
          m: g('jm'),
          c: cat,
          l: g('jl'),
          s: g('js'),
          e: +g('jx'),
          r: rVal,
          u: $('#jru')?.value || 'per_hour',
          addr: g('ja'),
          a4: d.slice(-4),
          tasks
        }
      };
      render();
    }
    function joinOtp() {
      const v = ($('#jo')?.value || '').trim();
      if (J.tries >= 3) {
        if ($('#je')) $('#je').textContent = 'Too many wrong codes. Go back and request a new demo code.';
        return;
      }
      if (v !== J.otp) {
        J.tries++;
        if ($('#je')) $('#je').textContent = 'Wrong code. ' + (3 - J.tries) + ' tries left.';
        return;
      }
      const d = J.d, id = 'w' + (S.workers.length + 1 + Date.now() % 1000);
      S.workers.push({
        id,
        name: d.n,
        cat: d.c,
        loc: d.l,
        exp: d.e,
        rate: d.r,
        unit: d.u || 'per_hour',
        travel: 30,
        avail: true,
        skills: d.s,
        rating: 0,
        rc: 0,
        ver: 'Demo verified',
        demo: false,
        hidden: false,
        a4: d.a4,
        addr: d.addr,
        mobile: d.m,
        tasks: d.tasks || [],
        geo: { lat: 12.9716, lng: 77.5946, dist: '1.0 km', eta: '~20 min' }
      });
      S.role = 'worker';
      S.me = id;
      J = { step: 1, d: null, otp: '', tries: 0 };
      save();
      toast('Sample verification complete');
      location.hash = 'work';
    }

    /* ============================================================
       ROUTER
       ============================================================ */
    function render() {
      const [r, ...a] = (location.hash.slice(1) || 'home').split('/'), arg = a.join('/');
      let h;
      const V = {
        welcome, join, home,
        find: () => find(decodeURIComponent(arg).includes('=') ? arg : (arg ? 'cat=' + arg : '')),
        hh: () => hhPage(arg),
        map: mapView,
        worker: () => profile(arg),
        book: () => book(arg),
        cust, work, impact, admin, about
      };
      h = (!S.role && !['welcome', 'join', 'about', 'admin', 'map', 'hh'].includes(r))
        ? welcome() : (V[r] || home)();

      const act = (r === 'worker' || r === 'book') ? 'find' : r;
      const IC = { home: '🏠', work: '🧰', impact: '📊', find: '🔍', hh: '🧹', map: '🗺️', cust: '📋', join: '🤝', about: 'ℹ️' };

      // Tab sets per role — hh tab for customer, map tab for all
      const T = S.role === 'worker'
        ? [['work', t('tab_work')], ['map', t('tab_map')], ['impact', t('tab_impact')]]
        : S.role === 'customer'
          ? [['find', t('tab_find')], ['hh', t('tab_hh')], ['map', t('tab_map')], ['cust', t('tab_cust')], ['impact', t('tab_impact')]]
          : [['home', t('tab_home')], ['find', t('tab_find')], ['hh', t('tab_hh')], ['map', t('tab_map')], ['join', t('tab_join')]];

      $('#tabs').innerHTML = T.map(x => `<a href="#${x[0]}" class="${act === x[0] ? 'on' : ''}"><i aria-hidden="true">${IC[x[0]] || '•'}</i><span>${x[1]}</span></a>`).join('');
      $('#tabs').hidden = false;
      document.body.classList.add('hastabs');

      // Task G: lang toggle is en ↔ hi only
      const langBtn = `<button class="btn alt sm" style="min-height:36px;padding:.2rem .65rem;font-size:.85rem;border-radius:99px" onclick="toggleLang()" title="Switch language / भाषा बदलें">🌐 <b>${S.lang === 'hi' ? 'English' : 'हिंदी'}</b></button>`;
      $('#nav').innerHTML = langBtn + `<a href="#about" class="${r === 'about' ? 'on' : ''}">${t('tab_about')}</a>` + (S.role ? '<a href="#welcome" onclick="logout()">Switch role</a>' : '') + `<a href="#admin" class="${r === 'admin' ? 'on' : ''}">Admin</a>`;
      $('.demo').innerHTML = `<b>${t('demo_bar')}</b>`;
      $('#app').innerHTML = (mem ? '<div class="card err">Browser storage is unavailable. Data will reset when you close this page.</div>' : '') + h;
      if (r === 'map') { setTimeout(initMap, 60); }
    }
    window.addEventListener('hashchange', () => { render(); scrollTo(0, 0); });
    render();
    setTimeout(() => { loading = false; render(); }, 350);
    // PWA service worker
    if (typeof navigator !== 'undefined' && 'serviceWorker' in navigator) {
      window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(err => console.warn('SW registration failed:', err)); });
    }
  </script>
</body>

</html>
