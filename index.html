<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SevaSetu – Trust for every home, Work for every hand</title>
  <link rel="icon" href="assets/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1F7A70">
  <link
    href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;800&family=Outfit:wght@700;800&family=Pacifico&display=swap"
    rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" crossorigin="">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" crossorigin=""></script>
  <script src="config.js"></script>
  <style>
    :root {
      --bg: #f6faf9;
      --card: #fff;
      --ink: #15302c;
      --mut: #4f6761;
      --line: #d6e4e0;
      --acc: #F2A66B;
      --soft: #fdeedd;
      --ok: #12805f;
      --bad: #b3261e;
      --pri: #1F7A70;
      --onpri: #fff;
      --sh: 0 1px 2px rgba(16, 35, 32, .07);
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    [hidden] {
      display: none !important
    }

    * {
      box-sizing: border-box
    }

    html {
      scroll-padding-top: env(safe-area-inset-top, 0px);
      -webkit-text-size-adjust: 100%
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 400 18px/1.55 Mukta, system-ui, -apple-system, "Segoe UI", sans-serif
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0 0 auto;
      height: env(safe-area-inset-top, 0px);
      background: var(--card);
      z-index: 10
    }

    h1,
    h2,
    h3 {
      line-height: 1.15;
      margin: 0 0 .5rem;
      font-weight: 800
    }

    h1 {
      font-size: clamp(2.1rem, 7vw, 3.6rem);
      letter-spacing: -.01em
    }

    h2 {
      font-size: 1.75rem
    }

    h3 {
      font-size: 1.2rem
    }

    a {
      color: var(--pri);
      font-weight: 600
    }

    header {
      background: var(--card);
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: env(safe-area-inset-top, 0px);
      z-index: 9
    }

    .bar {
      max-width: 1060px;
      margin: auto;
      padding: .55rem 1rem;
      display: flex;
      gap: .5rem;
      align-items: center;
      flex-wrap: wrap
    }

    .logo {
      font-weight: 800;
      font-size: 1.5rem;
      text-decoration: none;
      color: var(--ink);
      margin-right: .6rem
    }

    .logo span {
      color: var(--pri)
    }

    nav {
      display: flex;
      gap: .25rem;
      flex-wrap: wrap
    }

    nav a {
      padding: .45rem .8rem;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;
      color: var(--mut);
      display: flex;
      align-items: center;
      gap: .4rem
    }

    nav a.on {
      background: var(--soft);
      color: var(--ink)
    }

    #nav {
      margin-left: auto
    }

    #nav a {
      font-size: .92rem;
      padding: .35rem .6rem
    }

    #tabs i {
      display: none;
      font-style: normal
    }

    main {
      max-width: 1060px;
      margin: auto;
      padding: 1.2rem 1rem 3rem
    }

    .demo {
      background: var(--soft);
      border-bottom: 1px solid var(--acc);
      text-align: center;
      font-size: .9rem;
      padding: .4rem 1rem
    }

    .grid {
      display: grid;
      gap: 1rem;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr))
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 1.1rem;
      box-shadow: var(--sh)
    }

    a.card {
      color: var(--ink);
      transition: border-color .15s
    }

    a.card:hover {
      border-color: var(--pri)
    }

    a.card:active {
      background: var(--soft)
    }

    .row {
      display: flex;
      gap: .6rem;
      flex-wrap: wrap;
      align-items: center
    }

    .sp {
      justify-content: space-between
    }

    .btn {
      font: inherit;
      font-weight: 700;
      border: 2px solid var(--pri);
      background: var(--pri);
      color: var(--onpri);
      border-radius: 12px;
      padding: .6rem 1.1rem;
      min-height: 48px;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center
    }

    .btn:active {
      transform: scale(.98)
    }

    .btn.alt {
      background: transparent;
      color: var(--ink);
      border-color: var(--line)
    }

    .btn.bad {
      background: transparent;
      color: var(--bad);
      border-color: var(--bad)
    }

    .btn.sm {
      padding: .3rem .8rem;
      font-size: .95rem;
      min-height: 42px
    }

    :focus-visible {
      outline: 3px solid var(--acc);
      outline-offset: 2px
    }

    label {
      display: block;
      font-weight: 600;
      font-size: .98rem;
      margin: .8rem 0 .25rem
    }

    input,
    select,
    textarea {
      font: inherit;
      font-size: 1rem;
      width: 100%;
      min-height: 48px;
      padding: .6rem .75rem;
      border: 1.5px solid var(--line);
      border-radius: 12px;
      background: var(--bg);
      color: var(--ink)
    }

    textarea {
      min-height: 5rem
    }

    input[type=checkbox] {
      min-height: 0;
      width: 1.3rem;
      height: 1.3rem;
      accent-color: var(--pri);
      vertical-align: middle;
      margin-right: .5rem
    }

    .tag {
      display: inline-flex;
      align-items: center;
      font-size: .85rem;
      font-weight: 600;
      padding: .1rem .6rem;
      border-radius: 99px;
      border: 1px solid var(--line);
      color: var(--mut)
    }

    .tag.ok {
      color: var(--ok);
      border-color: var(--ok)
    }

    .tag.warn {
      color: var(--bad);
      border-color: var(--bad)
    }

    .tag.demo {
      background: var(--soft);
      color: var(--ink);
      border-color: var(--acc)
    }

    .dot {
      width: .6rem;
      height: .6rem;
      border-radius: 50%;
      background: var(--mut);
      display: inline-block;
      margin-right: .4rem
    }

    .tag.ok .dot {
      background: var(--ok)
    }

    .mut {
      color: var(--mut);
      font-size: .95rem
    }

    .err {
      color: var(--bad);
      font-size: .95rem;
      min-height: 1.2em
    }

    .hero {
      display: grid;
      gap: 1.5rem;
      grid-template-columns: 1.2fr 1fr;
      align-items: center;
      padding: 1rem 0 1.5rem
    }

    .hero>.card {
      border-top: 6px solid var(--acc)
    }

    @media(max-width:760px) {
      .hero {
        grid-template-columns: 1fr
      }
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-variant-numeric: tabular-nums
    }

    td,
    th {
      padding: .5rem 0;
      text-align: left;
      border-bottom: 1px dashed var(--line)
    }

    td:last-child,
    th:last-child {
      text-align: right
    }

    .tot td {
      font-weight: 800;
      font-size: 1.15rem;
      border-bottom: 0;
      border-top: 2px solid var(--ink)
    }

    .stat {
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--pri)
    }

    .steps {
      display: flex;
      gap: .3rem;
      flex-wrap: wrap;
      margin: .6rem 0
    }

    .steps span {
      font-size: .82rem;
      padding: .2rem .6rem;
      border-radius: 8px;
      background: var(--bg);
      color: var(--mut)
    }

    .steps .d {
      background: var(--ok);
      color: #fff
    }

    .steps .c {
      background: var(--acc);
      color: #14213d;
      font-weight: 700
    }

    .wc {
      display: grid;
      grid-template-columns: 56px 1fr;
      gap: .2rem .85rem;
      align-content: start
    }

    .wc .wm {
      min-width: 0
    }

    .wc .full {
      grid-column: 1/-1
    }

    .wc h3 {
      margin: 0
    }

    .wc p {
      margin: .3rem 0
    }

    .av {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 1.2rem;
      background: hsl(var(--h) 55% 88%);
      color: hsl(var(--h) 60% 22%)
    }

    .price {
      margin: .3rem 0
    }

    .price b {
      font-size: 1.5rem;
      font-weight: 800
    }

    details summary {
      cursor: pointer;
      min-height: 44px;
      display: flex;
      align-items: center
    }

    #toast {
      position: fixed;
      left: 50%;
      bottom: calc(1rem + env(safe-area-inset-bottom, 0px));
      transform: translateX(-50%);
      background: var(--pri);
      color: var(--onpri);
      font-weight: 600;
      padding: .7rem 1.1rem;
      border-radius: 12px;
      display: none;
      z-index: 20;
      max-width: 90%
    }

    @media(max-width:760px) {
      #tabs {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 12;
        background: var(--card);
        border-top: 1px solid var(--line);
        padding: .35rem .5rem calc(.35rem + env(safe-area-inset-bottom, 0px));
        gap: .25rem;
        flex-wrap: nowrap
      }

      #tabs a {
        flex: 1;
        flex-direction: column;
        gap: 0;
        padding: .35rem .2rem;
        font-size: .75rem;
        text-align: center;
        justify-content: center;
        min-height: 56px
      }

      #tabs i {
        display: block;
        font-size: 1.35rem;
        line-height: 1.2
      }

      body.hastabs main {
        padding-bottom: 6.5rem
      }

      body.hastabs #toast {
        bottom: calc(5.5rem + env(safe-area-inset-bottom, 0px))
      }

      #nav {
        margin-left: auto
      }
    }

    form.card>.grid {
      grid-template-columns: 1fr 1fr;
      gap: 0 .7rem
    }

    form.card>.grid>div:first-child {
      grid-column: 1/-1
    }

    .svc {
      grid-template-columns: repeat(4, 1fr)
    }

    @media(max-width:760px) {
      .svc {
        grid-template-columns: 1fr 1fr
      }
    }

    @media(min-width:761px) {
      form.card>.grid {
        grid-template-columns: 2fr 1fr 1fr 1fr
      }

      form.card>.grid>div:first-child {
        grid-column: auto
      }
    }

    .logo {
      display: flex;
      align-items: center;
      gap: .55rem;
      color: var(--ink);
      text-decoration: none;
      font-weight: 400
    }

    .logo .mk {
      width: 38px;
      height: 38px;
      flex: none
    }

    .wm {
      display: flex;
      align-items: baseline;
      line-height: 1.1
    }

    .sv {
      font-family: Outfit, Mukta, system-ui, sans-serif;
      font-weight: 800;
      letter-spacing: -.02em;
      color: var(--ink)
    }

    .st {
      font-family: Pacifico, cursive;
      font-weight: 400;
      color: #25B8A8;
      margin-left: 2px
    }

    .logo .sv {
      font-size: 1.45rem
    }

    .logo .st {
      font-size: 1.3rem
    }

    .lkb {
      display: flex;
      align-items: center;
      gap: .8rem
    }

    .lkb .mk {
      width: 64px;
      height: 64px;
      flex: none
    }

    .lkb .sv {
      font-size: 2.6rem
    }

    .lkb .st {
      font-size: 2.3rem
    }

    .mt {
      font-family: Outfit, Mukta, system-ui, sans-serif;
      font-weight: 700;
      font-size: 1.05rem;
      margin-top: .7rem;
      color: var(--ink)
    }

    @media(max-width:760px) {
      .logo .st {
        font-size: 1.2rem
      }

      .lkb .mk {
        width: 52px;
        height: 52px
      }

      .lkb .sv {
        font-size: 2.1rem
      }

      .lkb .st {
        font-size: 1.9rem
      }
    }

    @media(prefers-reduced-motion:reduce) {
      * {
        transition: none !important
      }
    }

    /* Map styles */
    #map-container {
      position: relative;
      width: 100%;
      height: 400px;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--line);
      background: var(--card);
      box-shadow: var(--sh);
      z-index: 1
    }

    @media(max-width:600px) {
      #map-container {
        height: 330px
      }
    }

    .map-badge-bar {
      display: flex;
      gap: .5rem;
      align-items: center;
      flex-wrap: wrap;
      margin: .6rem 0
    }

    .map-pin {
      background: var(--pri);
      color: #fff;
      border-radius: 50%;
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      box-shadow: 0 3px 8px rgba(0, 0, 0, .25);
      border: 2.5px solid #fff;
      cursor: pointer
    }

    .map-pin.busy {
      background: #718096
    }

    .leaflet-popup-content-wrapper {
      border-radius: 14px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, .18);
      font-family: inherit
    }

    .leaflet-popup-content {
      margin: 10px 12px;
      line-height: 1.4
    }

    /* Task chips */
    .chips {
      display: flex;
      gap: .3rem;
      flex-wrap: wrap;
      margin: .3rem 0
    }

    .chip {
      display: inline-flex;
      align-items: center;
      font-size: .78rem;
      font-weight: 600;
      padding: .15rem .55rem;
      border-radius: 99px;
      background: var(--bg);
      border: 1px solid var(--line);
      color: var(--mut)
    }

    .chip.ok {
      background: #e8f5f0;
      border-color: var(--ok);
      color: var(--ok)
    }

    /* House-help section banner */
    .hh-banner {
      background: linear-gradient(135deg, #1F7A70 0%, #25B8A8 100%);
      color: #fff;
      border-radius: 16px;
      padding: 1.2rem;
      margin-bottom: 1rem
    }

    .hh-banner h2 {
      color: #fff;
      margin-bottom: .3rem
    }

    .hh-banner .mut {
      color: rgba(255, 255, 255, .8)
    }

    /* Safety note */
    .safety-note {
      background: #fff8f0;
      border: 1.5px solid var(--acc);
      border-radius: 12px;
      padding: .7rem 1rem;
      font-size: .9rem;
      margin: .5rem 0
    }

    /* Task checklist group */
    .task-group {
      margin: .7rem 0
    }

    .task-group h4 {
      font-size: .95rem;
      font-weight: 700;
      color: var(--mut);
      margin: 0 0 .3rem;
      text-transform: uppercase;
      letter-spacing: .04em
    }

    .task-check-row {
      display: flex;
      align-items: center;
      gap: .4rem;
      padding: .2rem 0
    }

    .task-check-row input[type=checkbox] {
      flex: none
    }

    .task-check-row label {
      margin: 0;
      font-weight: 400;
      font-size: .95rem
    }

    /* ============================================================
       AUTHENTICATION: HEADER BUTTONS, MODALS, AND FORMS
       ============================================================ */
    .auth-btn-text {
      background: transparent;
      border: none;
      color: var(--ink);
      font-weight: 700;
      font-size: .88rem;
      padding: .35rem .75rem;
      border-radius: 99px;
      cursor: pointer;
      font-family: inherit;
      transition: background .15s ease, color .15s ease;
    }

    .auth-btn-text:hover {
      background: var(--soft);
      color: var(--pri);
    }

    .auth-btn-pill {
      background: #111827;
      border: 1px solid #111827;
      color: #ffffff !important;
      font-weight: 700;
      font-size: .88rem;
      padding: .38rem .95rem;
      border-radius: 99px;
      cursor: pointer;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      gap: .3rem;
      transition: transform .1s ease, background .15s ease;
    }

    .auth-btn-pill:hover {
      background: #1f2937;
      transform: translateY(-1px);
    }

    .auth-user-tag {
      display: inline-flex;
      align-items: center;
      gap: .35rem;
      background: var(--soft);
      color: var(--ink);
      padding: .32rem .75rem;
      border-radius: 99px;
      font-size: .86rem;
      font-weight: 600;
      border: 1px solid rgba(242, 166, 107, 0.4);
    }

    .auth-user-name {
      color: var(--pri);
      font-weight: 700;
    }

    .auth-btn-logout {
      background: transparent;
      border: 1px solid var(--line);
      color: var(--mut);
      font-weight: 600;
      font-size: .82rem;
      padding: .32rem .65rem;
      border-radius: 99px;
      cursor: pointer;
      font-family: inherit;
      transition: background .15s ease, color .15s ease, border-color .15s ease;
    }

    .auth-btn-logout:hover {
      background: #fee2e2;
      border-color: #fca5a5;
      color: #b91c1c;
    }

    /* Modal Backdrop */
    .auth-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.25rem 1rem;
      overflow-y: auto;
      animation: authFadeIn .2s ease-out;
    }

    @keyframes authFadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    /* Auth Cards */
    .auth-card {
      position: relative;
      background: #111827;
      color: #f9fafb;
      border-radius: 22px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(255, 255, 255, 0.08);
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      animation: authScaleUp .2s cubic-bezier(0.16, 1, 0.3, 1);
      box-sizing: border-box;
    }

    @keyframes authScaleUp {
      from {
        transform: scale(0.96);
        opacity: 0;
      }

      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    .auth-card-login {
      max-width: 440px;
    }

    .auth-card-signup {
      max-width: 820px;
      display: grid;
      grid-template-columns: 1fr 1.3fr;
      overflow: hidden;
    }

    .auth-card-body {
      padding: 2.2rem 2rem;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .auth-close-btn {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: rgba(255, 255, 255, 0.08);
      border: none;
      color: #9ca3af;
      width: 34px;
      height: 34px;
      border-radius: 99px;
      font-size: 1.4rem;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all .15s ease;
      z-index: 10;
    }

    .auth-close-btn:hover {
      background: rgba(255, 255, 255, 0.18);
      color: #ffffff;
    }

    /* Decorative Panel (Sign Up) */
    .auth-side-panel {
      background: linear-gradient(145deg, #092e2b 0%, #1F7A70 55%, #111827 100%);
      padding: 2.4rem 2rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
      border-right: 1px solid rgba(255, 255, 255, 0.08);
    }

    .auth-side-panel::before {
      content: '';
      position: absolute;
      top: -30px;
      left: -30px;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(242, 166, 107, 0.25) 0%, transparent 70%);
      pointer-events: none;
    }

    .auth-side-panel-top {
      display: flex;
      align-items: center;
      gap: .65rem;
    }

    .auth-brand-name {
      font-size: 1.4rem;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -.02em;
    }

    .auth-side-panel-middle {
      margin: 2rem 0;
    }

    .auth-tagline-quote {
      font-family: Georgia, serif;
      font-size: 3.2rem;
      line-height: 1;
      color: #F2A66B;
      opacity: 0.9;
      margin-bottom: -.4rem;
    }

    .auth-tagline-text {
      font-size: 1.45rem;
      font-weight: 700;
      line-height: 1.35;
      color: #ffffff;
      margin: 0 0 .75rem 0;
    }

    .auth-tagline-sub {
      font-size: .88rem;
      color: #cbd5e1;
      line-height: 1.5;
      margin: 0;
    }

    .auth-badge-row {
      display: flex;
      flex-wrap: wrap;
      gap: .4rem;
    }

    .auth-pill-tag {
      background: rgba(255, 255, 255, 0.12);
      color: #f1f5f9;
      font-size: .76rem;
      font-weight: 600;

      const onKey = e => { if (e.key === 'Escape') { const p = document.getElementById('ver-badge-popup'); if (p) { p.remove(); } document.removeEventListener('keydown', onKey); } };

    function total(q) { return q ? (Number(q.labor) || 0) + (Number(q.mat) || 0) + (Number(q.travel) || 0) : 0; }
    function fmtW(b) { return b.when === 'ASAP' ? 'As soon as possible (urgent)' : new Date(b.when).toLocaleString('en-IN', { dateStyle: 'medium', timeStyle: 'short' }); }
    function tableQ(q) { return `<table><tr><td>Base labour</td><td>${R(q.labor)}</td></tr><tr><td>Estimated materials / extras</td><td>${R(q.mat)}</td></tr><tr><td>Travel charge</td><td>${R(q.travel)}</td></tr><tr class="tot"><td>Total estimate</td><td>${R(total(q))}</td></tr></table>`; }
    function ini(n) { return n.split(' ').filter(Boolean).map(x => x[0]).slice(0, 2).join('').toUpperCase(); }

    /* Task chips helper: show first 3 tasks then "+N more" */
    function taskChips(tasks, maxShow = 3) {
      if (!tasks || tasks.length === 0) return '';
      const show = tasks.slice(0, maxShow);
      const rest = tasks.length - maxShow;
      return `<div class="chips">${show.map(tk => `<span class="chip ok">${esc(tk)}</span>`).join('')}${rest > 0 ? `<span class="chip">+${rest} more</span>` : ''}</div>`;
    }

    /* Safety note for senior/baby tasks */
    function hasSafetyTask(w) {
      return w.tasks && w.tasks.some(tk => SAFETY_TASKS.includes(tk));
    }

    /* BHK rates helpers for House help task "Sweeping and mopping" */
    function getBhkRate(w, bhk) {
      if (!w) return 0;
      const key = bhk === '1 BHK' ? 'rate_1bhk'
        : bhk === '2 BHK' ? 'rate_2bhk'
          : bhk === '3 BHK' ? 'rate_3bhk'
            : bhk === '4 BHK' ? 'rate_4bhk' : null;
      if (key && w[key] != null && !isNaN(w[key]) && Number(w[key]) > 0) {
        return Number(w[key]);
      }
      return Number(w.rate || 0);
    }

    function getAllBhkRates(w) {
      return {
        '1 BHK': getBhkRate(w, '1 BHK'),
        '2 BHK': getBhkRate(w, '2 BHK'),
        '3 BHK': getBhkRate(w, '3 BHK'),
        '4 BHK': getBhkRate(w, '4 BHK')
      };
    }

    function calcBookingLabour(w, tasks, bhk) {
      if (!w) return 0;
      if (!tasks || !tasks.length) return Number(w.rate || 0);
      const hasSweeping = tasks.includes('Sweeping and mopping');
      const otherTasks = tasks.filter(tk => tk !== 'Sweeping and mopping');
      if (hasSweeping) {
        const bhkPrice = getBhkRate(w, bhk || '1 BHK');
        return otherTasks.length > 0 ? bhkPrice + Number(w.rate || 0) : bhkPrice;
      }
      return Number(w.rate || 0);
    }

    function compressImage(file) {
      return new Promise((resolve, reject) => {
        const MAX_PX = 1600, QUALITY = 0.8;
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
          URL.revokeObjectURL(url);
          let w = img.naturalWidth, h = img.naturalHeight;
          if (w > MAX_PX || h > MAX_PX) {
            if (w >= h) { h = Math.round(h * MAX_PX / w); w = MAX_PX; }
            else { w = Math.round(w * MAX_PX / h); h = MAX_PX; }
          }
          const cv = document.createElement('canvas');
          cv.width = w; cv.height = h;
          cv.getContext('2d').drawImage(img, 0, 0, w, h);
          resolve(cv.toDataURL('image/jpeg', QUALITY));
        };
        img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Image load failed')); };
        img.src = url;
      });
    }

    async function handleRvPhotos(bid, input) {
      const statusEl = document.getElementById('rv-compress-status');
      const errEl = document.getElementById('rv-err');
      if (errEl) errEl.textContent = '';
      const files = Array.from(input.files || []);
      input.value = '';
      const ALLOWED = ['image/jpeg','image/png','image/webp','image/heic','image/heif'];
      const MAX_MB = 15 * 1024 * 1024;
      const errs = [];
      const valid = [];
      for (const f of files) {
        const typeOk = ALLOWED.includes(f.type) || /\.(heic|heif)$/i.test(f.name);
        if (!typeOk) { errs.push(t('review_photos_type_err') + ' (' + esc(f.name) + ')'); continue; }
        if (f.size > MAX_MB) { errs.push(t('review_photos_size_err') + ' (' + esc(f.name) + ')'); continue; }
        if (_rvPhotos.length + valid.length >= 6) { errs.push(t('review_photos_max_err')); break; }
        valid.push(f);
      }
      if (errs.length && errEl) errEl.textContent = errs.join(' ');
      if (!valid.length) return;
      if (statusEl) statusEl.textContent = t('review_compressing');
      for (let i = 0; i < valid.length; i++) {
        if (_rvPhotos.length >= 6) break;
        try {
          if (statusEl) statusEl.textContent = t('review_compressing') + ' ' + (i+1) + '/' + valid.length;
          const dataUrl = await compressImage(valid[i]);
          _rvPhotos.push(dataUrl);
          refreshRvThumbs();
        } catch(e) { if (errEl) errEl.textContent = (errEl.textContent ? errEl.textContent + ' ' : '') + 'Could not process ' + esc(valid[i].name); }
      }
      if (statusEl) statusEl.textContent = '';
    }

    function submitReview(bid) {
      const b = B(bid);
      if (!b) return;
      const errEl = document.getElementById('rv-err');
      if (errEl) errEl.textContent = '';
      // Get rating
      const sel = document.querySelector(`input[name="rvs_${bid}"]:checked`);
      if (!sel) { if (errEl) errEl.textContent = t('review_err_stars'); return; }
      const r = +sel.value;
      // Get note

      const tx = noteEl ? noteEl.value.trim() : '';
      if (tx.length > 0 && tx.length < 3) { if (errEl) errEl.textContent = t('review_err_note_min'); return; }
      // Update worker rating (adjust if editing existing)
      const w = W(b.wid);
      if (b.review) {
        // editing: remove old rating contribution
        const oldR = b.review.r;
        if (w.rc > 1) { w.rating = (w.rating * w.rc - oldR) / (w.rc - 1); w.rc--; }
        else { w.rating = 0; w.rc = 0; }
      }
      b.review = { r, t: tx, photos: [], at: new Date().toISOString() };
      w.rating = (w.rating * w.rc + r) / (w.rc + 1);
      w.rc++;
      // Try to save with photos, fall back to fewer if quota exceeded
      const photosToSave = _rvPhotos.slice();
      let saved = 0;
      for (let i = 0; i <= photosToSave.length; i++) {

        ? t('review_quota_err').replace('{n}', saved).replace('{total}', photosToSave.length)

      render();
    }

    let _leafletMap = null;
    function initMap() {
      const mapEl = $('#leaflet-map'), fallbackEl = $('#map-fallback'), containerEl = $('#map-container');
      if (!mapEl) return;
      if (typeof L === 'undefined') {
        if (containerEl) containerEl.style.display = 'none';
        if (fallbackEl) fallbackEl.style.display = 'block';
        return;
      }
      try {
        if (_leafletMap) { try { _leafletMap.remove(); } catch (e) { } _leafletMap = null; }
        const center = [12.9716, 77.5946];
        _leafletMap = L.map('leaflet-map', { zoomControl: true, scrollWheelZoom: false }).setView(center, 14);

        // Task A: OSM tile layer with tileerror → switch to CARTO, then fallback to list
        let usingCarto = false;
        const osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
          maxZoom: 18, errorTileUrl: ''
        });
        osmLayer.on('tileerror', function () {
          if (usingCarto) return; // already switched
          usingCarto = true;
          osmLayer.remove();
          const cartoLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
            subdomains: 'abcd', maxZoom: 19, errorTileUrl: ''
          });
          cartoLayer.on('tileerror', function () {
            // Both failed – show list fallback
            if (containerEl) containerEl.style.display = 'none';
            if (fallbackEl) fallbackEl.style.display = 'block';
          });
          cartoLayer.addTo(_leafletMap);
        });
        osmLayer.addTo(_leafletMap);

        const userIcon = L.divIcon({
          className: 'custom-user-pin',
          html: '<div style="background:#b3261e;color:#fff;border-radius:50%;width:34px;height:34px;display:grid;place-items:center;font-size:1.1rem;border:2.5px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.3)">📍</div>',
          iconSize: [34, 34], iconAnchor: [17, 17]
        });
        L.marker(center, { icon: userIcon }).addTo(_leafletMap).bindPopup('<b>You are here (Sample Location)</b><br><span class="mut">Central Bengaluru</span>');

        const bounds = L.latLngBounds([center]);
        const active = S.workers.filter(w => !w.hidden && w.geo);

          const marker = L.marker([w.geo.lat, w.geo.lng], { icon }).addTo(_leafletMap);
          bounds.extend([w.geo.lat, w.geo.lng]);
          const popHtml = `<div style="min-width:180px">
        <div style="font-weight:800;font-size:1.05rem">${esc(w.name)} ${verBadge(w)}</div>
        <div style="font-size:.9rem;color:#4f6761">${CATS[w.cat] || '🛠️'} ${esc(w.cat)} · ${esc(w.loc)}</div>
        <div style="margin:.3rem 0;display:flex;gap:.3rem;flex-wrap:wrap">
          <span class="tag ok" style="font-size:.75rem">📍 ${esc(w.geo.dist || '1 km')}</span>
          <span class="tag ok" style="font-size:.75rem">⚡ ${esc(w.geo.eta || '~25 min')}</span>
        </div>
        <div style="font-weight:800;color:#1F7A70;margin:.3rem 0">${R(w.rate)} <span style="font-size:.8rem;color:#4f6761">${fmtUnit(w.unit || 'per_hour')}</span></div>
        <div style="margin-top:.4rem;display:flex;gap:.4rem">
          <button class="btn sm" style="min-height:34px;padding:.2rem .6rem;font-size:.85rem;width:100%" onclick="selectMapWorker('${w.id}')">Select</button>
          <a class="btn alt sm" style="min-height:34px;padding:.2rem .6rem;font-size:.85rem;width:100%" href="#worker/${w.id}">Profile</a>
        </div>
      </div>`;
          marker.bindPopup(popHtml);
          marker.on('click', () => selectMapWorker(w.id));
        });
        if (active.length > 0) _leafletMap.fitBounds(bounds, { padding: [30, 30], maxZoom: 15 });
        setTimeout(() => { if (_leafletMap) _leafletMap.invalidateSize(); }, 150);
      } catch (err) {
        if (containerEl) containerEl.style.display = 'none';
        if (fallbackEl) fallbackEl.style.display = 'block';
      }
    }

      const submitBtn = isLogin ? t('auth_login_btn') : t('auth_create_acc_btn');
      const switchLink = isLogin ? `<a href="#" onclick="openAuthModal('signup');return false;">${t('auth_dont_have_acc')}</a>` : `<a href="#" onclick="openAuthModal('login');return false;">${t('auth_already_have_acc')}</a>`;
      const passwordToggle = `<button type="button" class="auth-eye-btn" onclick="togglePasswordVisibility('auth-${type}-pwd')" aria-label="${t('auth_show_password')}">&#128065;</button>`;
      const formFields = isLogin ?
        `<div class="auth-field"><label for="auth-${type}-email">${t('auth_email')}</label><input id="auth-${type}-email" type="email" required></div>` +
        `<div class="auth-field"><label for="auth-${type}-pwd">${t('auth_password')}</label><div class="auth-input-wrapper"><input id="auth-${type}-pwd" type="password" required>${passwordToggle}</div></div>`
        :
        `<div class="auth-name-grid"><div class="auth-field"><label for="auth-${type}-fname">${t('auth_first_name')}</label><input id="auth-${type}-fname" type="text" required></div>` +
        `<div class="auth-field"><label for="auth-${type}-lname">${t('auth_last_name')}</label><input id="auth-${type}-lname" type="text" required></div></div>` +
        `<div class="auth-field"><label for="auth-${type}-email">${t('auth_email')}</label><input id="auth-${type}-email" type="email" required></div>` +
        `<div class="auth-field"><label for="auth-${type}-pwd">${t('auth_password')}</label><div class="auth-input-wrapper"><input id="auth-${type}-pwd" type="password" required>${passwordToggle}</div></div>` +
        `<div class="auth-field-check"><label class="auth-check-label"><input type="checkbox" id="auth-${type}-terms" required> ${t('auth_terms_agree')}</label></div>`;
      const html = `
        <div class="${isLogin ? 'auth-card auth-card-login' : 'auth-card auth-card-signup'}">
          ${isLogin ? '' : `<div class="auth-side-panel"><div class="auth-side-panel-top"><span class="auth-brand-name">SevaSetu</span></div><div class="auth-side-panel-middle"><div class="auth-tagline-quote">&#8220;</div><div class="auth-tagline-text">${t('app_tagline')}</div><div class="auth-tagline-sub">${t('hero_h')}</div></div><div class="auth-badge-row"><span class="auth-pill-tag">${t('auth_coming_soon')}</span></div></div>`}
          <div class="auth-card-body">
            <button type="button" class="auth-close-btn" onclick="closeAuthModal()" aria-label="Close">&times;</button>
            <h2 class="auth-title" id="auth-modal-title">${title}</h2>
            <p class="auth-subtitle">${isLogin ? '' : `${t('auth_already_have_acc')} <a href="#" onclick="openAuthModal('login');return false;">${t('auth_login')}</a>`}</p>
            <form class="auth-form" onsubmit=\"event.preventDefault();${isLogin ? 'submitLogin()' : 'submitSignup()'}\">
              ${formFields}
              <div class="auth-field-err" id="auth-${type}-err"></div>
              <button type="submit" class="auth-submit-btn">${submitBtn}</button>
            </form>
            <div class="auth-divider"><span>${t('auth_or_register_with')}</span></div>
            <div class="auth-social-row"><button class="auth-social-btn" disabled>${t('auth_google')} <span class="auth-soon-pill">${t('auth_coming_soon')}</span></button><button class="auth-social-btn" disabled>${t('auth_apple')} <span class="auth-soon-pill">${t('auth_coming_soon')}</span></button></div>
            <div class="auth-demo-note"><span class="auth-demo-icon">&#9888;</span>${t('auth_demo_note')}</div>
          </div>
        </div>`;
      dlg.innerHTML = html;
      $('#auth-modal-backdrop').hidden = false;
      document.body.classList.add('modal-open');
    }
    function closeAuthModal() {
      $('#auth-modal-backdrop').hidden = true;
      $('#auth-modal-dialog').innerHTML = '';
      document.body.classList.remove('modal-open');
    }
    function handleAuthBackdropClick(e) { if (e.target === e.currentTarget) closeAuthModal(); }
    function togglePasswordVisibility(id) { const inp = document.getElementById(id); if (!inp) return; inp.type = inp.type === 'password' ? 'text' : 'password'; }
    function submitLogin() {
      const email = document.getElementById('auth-login-email').value.trim();
      const pwd = document.getElementById('auth-login-pwd').value;
      const errEl = document.getElementById('auth-login-err');
      errEl.textContent = '';
      if (!/^\S+@\S+\.\S+$/.test(email)) { errEl.textContent = t('auth_err_email_invalid'); return; }
      if (pwd.length < 8) { errEl.textContent = t('auth_err_pass_length'); return; }
      // Demo mode: store only name (before @) and email
      const firstName = email.split('@')[0];
      S.auth = { firstName, email }; save(); render(); closeAuthModal();
    }
    function submitSignup() {
      const fname = document.getElementById('auth-signup-fname').value.trim();
      const lname = document.getElementById('auth-signup-lname').value.trim();
      const email = document.getElementById('auth-signup-email').value.trim();
      const pwd = document.getElementById('auth-signup-pwd').value;
      const terms = document.getElementById('auth-signup-terms').checked;
      const errEl = document.getElementById('auth-signup-err');
      errEl.textContent = '';
      if (fname === '') { errEl.textContent = t('auth_err_fname_req'); return; }
      if (!/^\S+@\S+\.\S+$/.test(email)) { errEl.textContent = t('auth_err_email_invalid'); return; }
      if (pwd.length < 8) { errEl.textContent = t('auth_err_pass_length'); return; }
      if (!terms) { errEl.textContent = t('auth_err_terms_req'); return; }
      S.auth = { firstName: fname, email }; save(); render(); closeAuthModal();
    }
    function authName() {
      const n = (S.auth && (S.auth.firstName || S.auth.email)) || '';
      return String(n).replace(/[&<>"']/g, c => '&#' + c.charCodeAt(0) + ';');
    }
    function authLogout() {
      delete S.auth; save(); render(); toast('Logged out');
    }

    function acceptJob(id) { if (W(S.me).ver === 'Unverified') { toast('Complete sample verification to accept jobs'); location.hash = 'join'; return } setS(id, 'accepted', 'Request accepted. Send a quote next.'); }
    function clearJoinErr(fieldId) {
      const el = document.getElementById(fieldId + 'err');
      if (el) el.textContent = '';
      const formErr = document.getElementById('jerr');
      if (formErr) formErr.textContent = '';
    }
    function clearAllJoinErrs() {
      ['jn', 'jm', 'js', 'jx', 'jr', 'jtask', 'jbhk', 'ja', 'jd', 'jk'].forEach(k => {
        const el = document.getElementById(k + 'err');
        if (el) el.textContent = '';
      });
      const formErr = document.getElementById('jerr');
      if (formErr) formErr.textContent = '';
    }
    function showJoinFieldErr(fieldId, msg) {
      clearAllJoinErrs();
      const errEl = document.getElementById(fieldId + 'err');
      if (errEl) errEl.textContent = msg;
      const formErr = document.getElementById('jerr');
      if (formErr) formErr.textContent = msg;
      const inputEl = document.getElementById(fieldId);
      const target = inputEl || errEl;
      if (target) {
        if (typeof target.scrollIntoView === 'function') {
          target.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
        if (typeof target.focus === 'function') {
          target.focus();
        }
      }
    }
    function toggleJoinTaskSection(cat) {
      const el = document.getElementById('join-task-section');
      if (el) el.style.display = cat === 'House help' ? 'block' : 'none';
    }
    function toggleJoinBhk(checked) {
      const el = document.getElementById('join-bhk-box');
      if (el) el.style.display = checked ? 'block' : 'none';
    }
    function join() {
      if (J.step === 2) return `<h2>Verify (sample)</h2><div class="card"><p class="tag demo">Demo code: <b>${J.otp}</b></p><p class="mut">In a real app this code goes to the mobile linked to Aadhaar. Here it is shown on screen because the verification is simulated.</p><label for="jo">Enter the 6-digit code</label><input id="jo" inputmode="numeric" maxlength="6" oninput="if($('#je'))$('#je').textContent=''"><div class="err" id="je" role="alert"></div><button class="btn" onclick="joinOtp()">Verify</button> <button class="btn alt" onclick="J.step=1;J.tries=0;render()">Back</button></div>`;
      return `<a href="#welcome">← Back</a><h2>Become a service provider</h2><form class="card" onsubmit="event.preventDefault();joinGo()" oninput="clearAllJoinErrs()">
<label for="jn">Full name</label><input id="jn" oninput="clearJoinErr('jn')"><div class="err" id="jnerr" role="alert"></div>

<label for="jm">Mobile number (10 digits)</label><input id="jm" inputmode="numeric" maxlength="10" oninput="clearJoinErr('jm')"><div class="err" id="jmerr" role="alert"></div>

<label for="jc">Service</label><select id="jc" onchange="toggleJoinTaskSection(this.value);clearJoinErr('jtask')">${PRIMARY_CATS.map(c => `<option>${c}</option>`).join('')}</select>

<label for="jl">Locality you serve</label><select id="jl">${LOCS.map(c => `<option>${c}</option>`).join('')}</select>

<label for="js">Skills</label><input id="js" oninput="clearJoinErr('js')"><div class="err" id="jserr" role="alert"></div>

<label for="jx">Years of experience</label><input id="jx" type="number" min="0" max="60" oninput="clearJoinErr('jx')"><div class="err" id="jxerr" role="alert"></div>

<label for="jr">Base rate (₹)</label><input id="jr" type="number" min="50" oninput="clearJoinErr('jr')"><div class="err" id="jrerr" role="alert"></div>

<label for="jru">Rate unit</label><select id="jru"><option value="per_hour">Per hour (/hr)</option><option value="per_visit">Per visit (/visit)</option><option value="per_day">Per day (/day)</option></select>

<!-- Task C: House help task checklist in join flow (visible by default because House help is default category) -->
<div id="join-task-section" style="display:block">
  <label>What work can you do? (tick at least one)</label>
  <div class="card" style="padding:.6rem;background:var(--bg)">
  ${Object.keys(HH_TASK_GROUPS).map(grp => `
  <div class="task-group"><h4>${grp}${grp === 'Senior care' ? ` <small style="font-weight:400;text-transform:none">${t('senior_note')}</small>` : ''}</h4>
  ${HH_TASK_GROUPS[grp].map(tk => {
        const isSweeping = tk === 'Sweeping and mopping';
        return `<div class="task-check-row"><input type="checkbox" class="join-task" id="jtk_${esc(tk.replace(/\W/g, '_'))}" value="${esc(tk)}" onchange="clearJoinErr('jtask')${isSweeping ? ';toggleJoinBhk(this.checked)' : ''}"><label for="jtk_${esc(tk.replace(/\W/g, '_'))}">${esc(tk)}</label></div>`;
      }).join('')}
  </div>`).join('')}
  <div id="join-bhk-box" style="display:none;margin:.5rem 0;padding:.6rem;background:var(--soft);border-radius:8px">
    <b>🧹 ${t('bhk_rates_title')}</b>
    <p class="mut" style="font-size:.85rem;margin:.2rem 0 .4rem">${t('bhk_rates_subtitle')}</p>
    <div class="grid" style="grid-template-columns:repeat(4,1fr);margin-top:.4rem;gap:.4rem">
      <div><label for="j_bhk1">1 BHK (₹)</label><input id="j_bhk1" type="number" min="1" placeholder="200" oninput="clearJoinErr('jbhk')"></div>
      <div><label for="j_bhk2">2 BHK (₹)</label><input id="j_bhk2" type="number" min="1" placeholder="250" oninput="clearJoinErr('jbhk')"></div>
      <div><label for="j_bhk3">3 BHK (₹)</label><input id="j_bhk3" type="number" min="1" placeholder="300" oninput="clearJoinErr('jbhk')"></div>
      <div><label for="j_bhk4">4 BHK (₹)</label><input id="j_bhk4" type="number" min="1" placeholder="350" oninput="clearJoinErr('jbhk')"></div>
    </div>
    <div class="err" id="jbhkerr" role="alert"></div>
  </div>
  <div class="task-group"><h4>Other</h4><input id="join-task-other" maxlength="120" placeholder="Describe any additional services" oninput="clearJoinErr('jtask')"></div>
  </div>
  <div class="err" id="jtaskerr" role="alert"></div>
</div>

<label for="ja">Home address (private)</label><textarea id="ja" rows="2" oninput="clearJoinErr('ja')"></textarea><div class="err" id="jaerr" role="alert"></div><p class="mut">Used only for admin checks. Never shown to customers.</p>

<label for="jd">Aadhaar number (12 digits)</label><input id="jd" inputmode="numeric" maxlength="12" oninput="clearJoinErr('jd')"><div class="err" id="jderr" role="alert"></div><p class="mut"><b>Demo only: do not enter a real Aadhaar number.</b> Type any 12 digits. Only the last 4 digits are kept.</p>

<label><input id="jk" type="checkbox" style="width:auto" onchange="clearJoinErr('jk')"> I agree to this sample verification</label><div class="err" id="jkerr" role="alert"></div>
<div class="err" id="jerr" role="alert"></div>
<button class="btn" id="join-submit-btn">Send demo code</button></form>`;
    }
    function joinGo() {
      clearAllJoinErrs();
      const g = i => ($('#' + i)?.value || '').trim();
      const d = g('jd');

      if (g('jn').length < 2) { showJoinFieldErr('jn', 'Enter your full name.'); return; }
      if (!/^\d{10}$/.test(g('jm'))) { showJoinFieldErr('jm', 'Mobile number must be 10 digits.'); return; }
      if (g('js').length < 3) { showJoinFieldErr('js', 'Add your skills.'); return; }
      if (g('jx') === '' || isNaN(+g('jx')) || +g('jx') < 0) { showJoinFieldErr('jx', 'Enter years of experience.'); return; }
      const rVal = +g('jr');
      if (!g('jr') || isNaN(rVal) || rVal < 50) { showJoinFieldErr('jr', 'Rate must be at least ₹50.'); return; }

      // House help task validation
      const cat = g('jc') || 'House help';
      let tasks = [];
      let r1 = null, r2 = null, r3 = null, r4 = null;
      if (cat === 'House help') {
        tasks = Array.from(document.querySelectorAll('.join-task:checked')).map(el => el.value);
        const otherVal = ($('#join-task-other')?.value || '').trim().replace(/[<>&"']/g, '').slice(0, 120);
        if (otherVal) tasks.push(otherVal);
        if (tasks.length === 0) {
          toggleJoinTaskSection('House help');
          showJoinFieldErr('jtask', 'Tick at least one task you can do.');
          return;
        }

        if (tasks.includes('Sweeping and mopping')) {
          r1 = +g('j_bhk1');
          r2 = +g('j_bhk2');
          r3 = +g('j_bhk3');
          r4 = +g('j_bhk4');
          if (!(r1 > 0 && r2 > 0 && r3 > 0 && r4 > 0)) {
            toggleJoinBhk(true);
            showJoinFieldErr('jbhk', t('err_bhk_rates_positive'));
            return;
          }
          if (!(r1 <= r2 && r2 <= r3 && r3 <= r4)) {
            toggleJoinBhk(true);
            showJoinFieldErr('jbhk', t('err_bhk_rates_ascending'));
            return;
          }
        }
      }

      // Address validation
      if (!g('ja')) { showJoinFieldErr('ja', 'Enter your home address.'); return; }
      if (g('ja').length < 8) { showJoinFieldErr('ja', 'Address is too short. Add house number, street and area.'); return; }

      // Aadhaar validation
      if (!/^\d{12}$/.test(d)) { showJoinFieldErr('jd', 'Aadhaar number must be 12 digits.'); return; }

      // Consent validation
      if (!$('#jk')?.checked) { showJoinFieldErr('jk', 'Tick the consent box to continue.'); return; }

      J = {
        step: 2,
        otp: String(100000 + Math.floor(Math.random() * 900000)),
        tries: 0,
        d: {
          n: g('jn'),
          m: g('jm'),
          c: cat,
          l: g('jl'),
          s: g('js'),
          e: +g('jx'),
          r: rVal,
          u: $('#jru')?.value || 'per_hour',
          addr: g('ja'),
          a4: d.slice(-4),
          tasks,
          rate_1bhk: r1,
          rate_2bhk: r2,
          rate_3bhk: r3,
          rate_4bhk: r4
        }
      };
      render();
    }
    function joinOtp() {
      const v = ($('#jo')?.value || '').trim();
      if (J.tries >= 3) {
        if ($('#je')) $('#je').textContent = 'Too many wrong codes. Go back and request a new demo code.';
        return;
      }
      if (v !== J.otp) {
        J.tries++;
        if ($('#je')) $('#je').textContent = 'Wrong code. ' + (3 - J.tries) + ' tries left.';
        return;
      }
      const d = J.d, id = 'w' + (S.workers.length + 1 + Date.now() % 1000);
      S.workers.push({
        id,
        name: d.n,
        cat: d.c,
        loc: d.l,
        exp: d.e,
        rate: d.r,
        unit: d.u || 'per_hour',
        travel: 30,
        avail: true,
        skills: d.s,
        rating: 0,
        rc: 0,
        ver: 'pending',
        demo: false,
        hidden: false,
        a4: d.a4,
        addr: d.addr,
        mobile: d.m,
        tasks: d.tasks || [],
        rate_1bhk: d.rate_1bhk,
        rate_2bhk: d.rate_2bhk,
        rate_3bhk: d.rate_3bhk,
        rate_4bhk: d.rate_4bhk,
        geo: { lat: 12.9716, lng: 77.5946, dist: '1.0 km', eta: '~20 min' }
      });
      S.role = 'worker';
      S.me = id;
      J = { step: 1, d: null, otp: '', tries: 0 };
      save();
      toast('Registration submitted – verification pending');
      location.hash = 'work';
    }

    /* ============================================================
       ROUTER
       ============================================================ */
    function render() {
      const [r, ...a] = (location.hash.slice(1) || 'home').split('/'), arg = a.join('/');
      let h;
      const V = {
        welcome, join, home,
        find: () => find(decodeURIComponent(arg).includes('=') ? arg : (arg ? 'cat=' + arg : '')),
        hh: () => hhPage(arg),
        map: mapView,
        worker: () => profile(arg),
        book: () => book(arg),
        cust, work, impact, admin, about
      };
      h = (!S.role && !['welcome', 'join', 'about', 'admin', 'map', 'hh'].includes(r))
        ? welcome() : (V[r] || home)();

      const act = (r === 'worker' || r === 'book') ? 'find' : r;
      const IC = { home: '🏠', work: '🧰', impact: '📊', find: '🔍', hh: '🧹', map: '🗺️', cust: '📋', join: '🤝', about: 'ℹ️' };

      // Tab sets per role — hh tab for customer, map tab for all
      const T = S.role === 'worker'
        ? [['work', t('tab_work')], ['map', t('tab_map')], ['impact', t('tab_impact')]]
        : S.role === 'customer'
          ? [['find', t('tab_find')], ['hh', t('tab_hh')], ['map', t('tab_map')], ['cust', t('tab_cust')], ['impact', t('tab_impact')]]
          : [['home', t('tab_home')], ['find', t('tab_find')], ['hh', t('tab_hh')], ['map', t('tab_map')], ['join', t('tab_join')]];

      $('#tabs').innerHTML = T.map(x => `<a href="#${x[0]}" class="${act === x[0] ? 'on' : ''}"><i aria-hidden="true">${IC[x[0]] || '•'}</i><span>${x[1]}</span></a>`).join('');
      $('#tabs').hidden = false;
      document.body.classList.add('hastabs');

      // Task G: lang toggle is en ↔ hi only
      const langBtn = `<button class="btn alt sm" style="min-height:36px;padding:.2rem .65rem;font-size:.85rem;border-radius:99px" onclick="toggleLang()" title="Switch language / भाषा बदलें">🌐 <b>${S.lang === 'hi' ? 'English' : 'हिंदी'}</b></button>`;
      $('#nav').innerHTML = langBtn + `<a href="#about" class="${r === 'about' ? 'on' : ''}">${t('tab_about')}</a>` + (S.role ? '<a href="#welcome" onclick="logout()">Switch role</a>' : '') + `<a href="#admin" class="${r === 'admin' ? 'on' : ''}">Admin</a>` + (S.auth ? `<span style="font-weight:600;padding:0 .5rem">👤 ${authName()}</span><button type="button" class="btn alt sm" style="min-height:36px;padding:.2rem .65rem;font-size:.85rem" onclick="authLogout()">Log out</button>` : `<button type="button" class="btn alt sm" style="min-height:36px;padding:.2rem .65rem;font-size:.85rem" onclick="openAuthModal('login')">${t('auth_login')}</button><button type="button" class="btn sm" style="min-height:36px;padding:.2rem .65rem;font-size:.85rem" onclick="openAuthModal('signup')">${t('auth_signup')}</button>`);
      $('.demo').innerHTML = `<b>${t('demo_bar')}</b>`;
      $('#app').innerHTML = (mem ? '<div class="card err">Browser storage is unavailable. Data will reset when you close this page.</div>' : '') + h;
      if (r === 'map') { setTimeout(initMap, 60); }
    }
    window.addEventListener('hashchange', () => { render(); scrollTo(0, 0); });
    render();
    setTimeout(() => { loading = false; render(); }, 350);
    // PWA service worker
    if (typeof navigator !== 'undefined' && 'serviceWorker' in navigator) {
      window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(err => console.warn('SW registration failed:', err)); });
    }
  </script>
</body>

</html>
